<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Hub</title>
  <meta name="application-name" content="Lab Hub" />
  <meta name="apple-mobile-web-app-title" content="Lab Hub" />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-dentro">
      <div>
        <h1>Lab Hub</h1>
        <p class="sub">Projetos em fase beta. Cada um com título, ideia e objetivo próprios.</p>
      </div>
      <span class="contador" id="contador" hidden></span>
    </div>
  </header>

  <main class="conteudo">
    <div class="filtros" id="filtros" hidden>
      <button type="button" data-fase="" class="ativo">Todos</button>
      <button type="button" data-fase="beta">Beta</button>
      <button type="button" data-fase="pronto">Pronto para migrar</button>
      <button type="button" data-fase="migrado">Migrado</button>
    </div>

    <p class="aviso" id="carregando">Carregando projetos...</p>
    <section class="grade" id="grade" aria-live="polite"></section>
  </main>

  <dialog class="sobre" id="sobre" aria-labelledby="sobre-titulo">
    <div class="sobre-caixa">
      <div class="sobre-topo">
        <div>
          <p class="sobre-rotulo">Sobre o projeto</p>
          <h2 id="sobre-titulo"></h2>
        </div>
        <button type="button" class="fechar" data-fechar aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <span id="sobre-fase" class="fase"></span>
      <dl>
        <div><dt>Ideia</dt><dd id="sobre-ideia"></dd></div>
        <div><dt>Objetivo</dt><dd id="sobre-objetivo"></dd></div>
      </dl>
      <a class="botao" id="sobre-abrir" href="#">Abrir projeto <span aria-hidden="true">→</span></a>
    </div>
  </dialog>

  <script src="/navegador.js"></script>
  <script src="/hub.js"></script>
  <!-- A Jean em qualquer tela: botao flutuante e Ctrl+K (base, ver jean-painel.js). -->
  <script src="/jean-painel.js" defer></script>
</body>
</html>
