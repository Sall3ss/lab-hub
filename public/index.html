<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Hub</title>
  <meta name="application-name" content="Lab Hub" />
  <meta name="apple-mobile-web-app-title" content="Lab Hub" />
  <meta name="theme-color" content="#07090e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <!-- Fundo: recortes da planta "Lab Hub System Schematic" do dono (esfera no centro). -->
  <div class="fundo-arte" aria-hidden="true">
    <img class="fa-chip" src="/hub-fundo/chip.webp" alt="" decoding="async" />
    <img class="fa-fluxo" src="/hub-fundo/fluxo.webp" alt="" decoding="async" />
    <div class="fa-esfera"><img src="/hub-fundo/esfera.webp" alt="" decoding="async" /></div>
  </div>

  <header class="topo">
    <div class="topo-dentro">
      <div class="marca">
        <p class="rotulo-tec">// SISTEMA DE LABORATÓRIO · NÚCLEO v2</p>
        <h1>Lab Hub</h1>
        <p class="sub">Projetos em fase beta. Cada um com título, ideia e objetivo próprios.</p>
      </div>
      <div class="telemetria" id="contador" role="status" hidden>
        <span class="tl-rotulo">REGISTRO DO SISTEMA</span>
        <span class="tl-valor"><b id="contador-num">00</b> <span id="contador-txt">MÓDULOS</span></span>
        <span class="tl-linha"><i class="tl-ponto" aria-hidden="true"></i>ONLINE · <span id="contador-fases"></span></span>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por fase" hidden>
      <button type="button" data-fase="" class="ativo"><span class="cod">00</span>Todos</button>
      <button type="button" data-fase="beta"><span class="cod">01</span>Beta</button>
      <button type="button" data-fase="pronto"><span class="cod">02</span>Pronto para migrar</button>
      <button type="button" data-fase="migrado"><span class="cod">03</span>Migrado</button>
    </div>

    <p class="aviso" id="carregando">&gt; carregando módulos<span class="cursor" aria-hidden="true">_</span></p>
    <section class="grade" id="grade" aria-live="polite"></section>
  </main>

  <dialog class="sobre" id="sobre" aria-labelledby="sobre-titulo">
    <div class="sobre-caixa">
      <div class="sobre-topo">
        <div>
          <p class="sobre-rotulo"><span id="sobre-id"></span> // Sobre o projeto</p>
          <h2 id="sobre-titulo"></h2>
        </div>
        <button type="button" class="fechar" data-fechar aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <span id="sobre-fase" class="fase"></span>
      <dl>
        <div><dt>Ideia</dt><dd id="sobre-ideia"></dd></div>
        <div><dt>Objetivo</dt><dd id="sobre-objetivo"></dd></div>
      </dl>
      <a class="botao" id="sobre-abrir" href="#">Abrir projeto <span aria-hidden="true">→</span></a>
    </div>
  </dialog>

  <script src="/navegador.js"></script>
  <script src="/hub.js"></script>
  <!-- A Jean em qualquer tela: botao flutuante e Ctrl+K (base, ver jean-painel.js). -->
  <script src="/jean-painel.js" defer></script>
</body>
</html>
