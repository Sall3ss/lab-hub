<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Hub</title>
  <meta name="application-name" content="Lab Hub" />
  <meta name="apple-mobile-web-app-title" content="Lab Hub" />
  <meta name="theme-color" content="#07090e" />
  <!-- Ícone da aba: logo do dono (hexágono), sem o fundo. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/hub-icone/hub-icone-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/hub-icone/hub-icone-192.png" />
  <link rel="apple-touch-icon" href="/hub-icone/hub-icone-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <!-- Fundo: HUD no estilo das telas do Stark, desenhado em SVG (sem imagem, ~3 KB).
       Um reator de aneis finos no canto direito, girando devagar, e a moldura da tela.
       Tudo ciano e fraco, para o destaque ficar nos cartoes. Autoria: Claude (Opus 5.5). -->
  <div class="fundo-hud" aria-hidden="true">
    <svg class="reator" viewBox="-500 -500 1000 1000">
      <defs>
        <radialGradient id="nucleo"><stop offset="0" stop-color="#bffcff" stop-opacity=".9"/><stop offset=".35" stop-color="#00f0ff" stop-opacity=".35"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle r="482" class="fio"/>
      <circle r="458" class="regua"/>
      <circle r="458" class="regua-maior"/>
      <g class="gira-1"><circle r="420" class="arcos"/></g>
      <g class="gira-2"><circle r="372" class="pontilhado"/></g>
      <circle r="330" class="fio fraco"/>
      <g class="gira-3"><circle r="290" class="setores"/></g>
      <circle r="215" class="fio"/>
      <g class="gira-2"><circle r="180" class="pontilhado"/></g>
      <path class="mira" d="M-500 0H-240M240 0H500M0 -500V-240M0 240V500"/>
      <path class="mira fraco" d="M-120 0H120M0 -120V120"/>
      <circle r="120" class="fio"/>
      <g class="gira-1"><path class="tri" d="M0 -95 82 47.5 -82 47.5Z"/></g>
      <circle r="140" fill="url(#nucleo)" class="pulso"/>
      <text x="250" y="-312">SYS.CORE // 98.2%</text>
      <text x="300" y="338">PWR ▮▮▮▮▯ · ESTÁVEL</text>
    </svg>
    <span class="moldura m1"></span><span class="moldura m2"></span><span class="moldura m3"></span><span class="moldura m4"></span>
    <span class="varre"></span>
  </div>

  <header class="topo">
    <div class="topo-dentro">
      <div class="marca">
        <p class="rotulo-tec">// SISTEMA DE LABORATÓRIO · NÚCLEO v2</p>
        <h1>Lab Hub</h1>
        <p class="sub">Projetos em fase beta. Cada um com título, ideia e objetivo próprios.</p>
      </div>
      <div class="telemetria" id="contador" role="status" hidden>
        <span class="tl-rotulo">REGISTRO DO SISTEMA</span>
        <span class="tl-valor"><b id="contador-num">00</b> <span id="contador-txt">MÓDULOS</span></span>
        <span class="tl-linha"><i class="tl-ponto" aria-hidden="true"></i>ONLINE · <span id="contador-fases"></span></span>
      </div>
    </div>
  </header>

  <main class="conteudo">
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por fase" hidden>
      <button type="button" data-fase="" class="ativo"><span class="cod">00</span>Todos</button>
      <button type="button" data-fase="beta"><span class="cod">01</span>Beta</button>
      <button type="button" data-fase="pronto"><span class="cod">02</span>Pronto para migrar</button>
      <button type="button" data-fase="migrado"><span class="cod">03</span>Migrado</button>
    </div>

    <p class="aviso" id="carregando">&gt; carregando módulos<span class="cursor" aria-hidden="true">_</span></p>
    <section class="grade" id="grade" aria-live="polite"></section>
  </main>

  <dialog class="sobre" id="sobre" aria-labelledby="sobre-titulo">
    <div class="sobre-caixa">
      <div class="sobre-topo">
        <div>
          <p class="sobre-rotulo"><span id="sobre-id"></span> // Sobre o projeto</p>
          <h2 id="sobre-titulo"></h2>
        </div>
        <button type="button" class="fechar" data-fechar aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <span id="sobre-fase" class="fase"></span>
      <dl>
        <div><dt>Ideia</dt><dd id="sobre-ideia"></dd></div>
        <div><dt>Objetivo</dt><dd id="sobre-objetivo"></dd></div>
      </dl>
      <a class="botao" id="sobre-abrir" href="#">Abrir projeto <span aria-hidden="true">→</span></a>
    </div>
  </dialog>

  <script src="/navegador.js"></script>
  <script src="/hub.js"></script>
  <!-- A Jean em qualquer tela: botao flutuante e Ctrl+K (base, ver jean-painel.js). -->
  <script src="/jean-painel.js" defer></script>
</body>
</html>
