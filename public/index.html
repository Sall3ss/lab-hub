<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Hub</title>
  <meta name="application-name" content="Lab Hub" />
  <meta name="apple-mobile-web-app-title" content="Lab Hub" />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-dentro">
      <div>
        <h1>Lab Hub</h1>
        <p class="sub">Projetos em fase beta. Cada um com título, ideia e objetivo próprios.</p>
      </div>
      <span class="contador" id="contador" hidden></span>
    </div>
  </header>

  <main class="conteudo">
    <div class="filtros" id="filtros" hidden>
      <button type="button" data-fase="" class="ativo">Todos</button>
      <button type="button" data-fase="beta">Beta</button>
      <button type="button" data-fase="pronto">Pronto para migrar</button>
      <button type="button" data-fase="migrado">Migrado</button>
    </div>

    <p class="aviso" id="carregando">Carregando projetos...</p>
    <section class="grade" id="grade" aria-live="polite"></section>
  </main>

  <script src="/navegador.js"></script>
  <script src="/hub.js"></script>
</body>
</html>
