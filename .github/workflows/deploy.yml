name: deploy

# Publica no Cloudflare Pages a cada push na main. Quem tem as credenciais é o GitHub
# Actions, nunca uma máquina de desenvolvimento - por isso o deploy mora aqui.
#
# OS NOMES FICAM AQUI, no próprio arquivo, e não em variáveis do GitHub. Motivo: variável
# de repositório é mais um passo manual a cada cliente novo, e quando alguém esquece o
# deploy falha com uma mensagem que não aponta para a causa. Aqui o nome está versionado
# e à vista.
#
# ⚠️ `CLIENTE-SLUG` abaixo é PLACEHOLDER, e nada o substitui sozinho: o `novo-projeto`
# copia este arquivo como está, de propósito, porque o nome definitivo é decisão do gestor
# e vem depois da criação da pasta. Quem troca é o técnico, na etapa 9, junto com o
# `wrangler.toml`. Antes do primeiro push: `grep -rn CLIENTE-SLUG .` tem que vir vazio.
#
# O `if` impede que este workflow rode no repositório TEMPLATE, que não tem Pages nem
# banco: sem ele, todo push no template dispara um deploy que falha e enche o e-mail do
# gestor. No clone de um cliente o nome do repo é outro, então o job roda normalmente.
# Compara pelo NOME do repositório, não pelo dono: em 11/09/2026 o template mudou de conta
# (informaticaf1 -> informaticaf1-clientes) e a trava que citava o dono deixou de valer.
#
# Autoria: Claude (Opus 5).

# Lab Hub (15/10/2026): Cloudflare pessoal do dono, D1 e secrets gravados -> push religado.
# `workflow_dispatch` permite publicar de novo à mão, pela aba Actions, sem commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PAGES_PROJECT: lab-hub
  D1_DATABASE: lab-hub-d1
  CYBERIDLE_PROJECT: cyberidle-game
  WRANGLER_VERSION: "4.118.0"

jobs:
  deploy:
    if: github.event.repository.name != 'base-cliente'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Migrations antes do deploy: o código novo pode depender de tabela nova.
      # `d1 migrations apply` é idempotente - só roda o que ainda não rodou.
      - name: Aplicar migrations no D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply ${{ env.D1_DATABASE }} --remote

      # Lab Hub: o projeto Pages nasce aqui, na primeira publicacao, para o dono nao ter que
      # criar pelo painel (o painel exige subir arquivos a mao). Se ja existe, o create
      # falha e seguimos; se falhou por outro motivo, o passo seguinte acusa. Claude (Opus 5.5).
      - name: Criar o projeto Pages (so na primeira vez)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create ${{ env.PAGES_PROJECT }} --production-branch main

      - name: Publicar Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy ./public --project-name ${{ env.PAGES_PROJECT }}

      # Cyberidle: o jogo tem endereco proprio (https://cyberidle-game.pages.dev), separado
      # do hub, para que um pedido de remocao da arte (sprites do Tibia, da CipSoft) derrube
      # so o jogo e nao o hub. Mesmo token e conta. Lab Hub, Claude (Opus 5.5), 20/10/2026.
      # `npx` direto (e nao o wrangler-action, que instala o wrangler na pasta e o package.json
      # iria para o site), e de uma COPIA fora do repo: o wrangler procura wrangler.toml subindo
      # as pastas e usaria o do hub (nome, D1).
      - name: Publicar o Cyberidle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D="$RUNNER_TEMP/cyberidle"
          mkdir -p "$D"
          cp -r projetos/cyberidle/site "$D/site"
          # Salvamento na nuvem (26/10/2026): funções em projetos/cyberidle/nuvem/functions,
          # usando o MESMO D1 do hub (tabelas cyberidle_*, migration 0002 aplicada acima).
          # O wrangler.toml fica FORA de site/ para não ser publicado como arquivo.
          cp -r projetos/cyberidle/nuvem/functions "$D/functions"
          D1_ID=$(grep -m1 '^database_id' wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/')
          printf '%s\n' \
            "name = \"${CYBERIDLE_PROJECT}\"" \
            'pages_build_output_dir = "site"' \
            'compatibility_date = "2025-09-23"' \
            '' \
            '[[d1_databases]]' \
            'binding = "DB"' \
            "database_name = \"${D1_DATABASE}\"" \
            "database_id = \"${D1_ID}\"" > "$D/wrangler.toml"
          cat "$D/wrangler.toml"
          cd "$D"
          npx --yes wrangler@${WRANGLER_VERSION} pages project create "${CYBERIDLE_PROJECT}" --production-branch main \
            || echo "projeto ja existe (ou falhou a criacao; o deploy abaixo acusa)"
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy --project-name "${CYBERIDLE_PROJECT}" --branch main
